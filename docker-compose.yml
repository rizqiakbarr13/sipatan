services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pertanahan
      POSTGRES_PASSWORD: pertanahan
      POSTGRES_DB: pertanahan
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pertanahan -d pertanahan"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Contoh service app untuk self-host VPS. Untuk dev lokal, jalankan
  # `npm run dev` langsung di host dan hanya pakai service `db` dari compose ini.
  # app:
  #   build: .
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  db_data:
